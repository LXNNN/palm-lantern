    <script>
        // --- GLOBAL VARIABLES ---
        let userPhotos = [];
        let userAudio = null;
        let isCameraReady = false;
        let globalStream = null; 

        // --- PHASE 1: PRELOAD ON LOAD ---
        window.onload = () => {
            // Start 3D Engine IMMEDIATELY in background
            if (window.startThreeEngine) window.startThreeEngine();

            // UI Logic
            const status = document.getElementById('sys-status');
            const btn = document.getElementById('init-btn');
            const spinner = document.getElementById('sys-spinner');

            status.innerHTML = "欢迎。<br>点击下方按钮开启摄像头，<br>体验手势互动。";
            spinner.style.display = 'none';
            btn.style.display = 'block';
        };

        // --- PHASE 2: PERMISSION ---
        async function requestPermissionAndNext() {
            const status = document.getElementById('sys-status');
            const btn = document.getElementById('init-btn');
            const spinner = document.getElementById('sys-spinner');

            btn.style.display = 'none';
            spinner.style.display = 'block';
            status.innerText = "正在请求摄像头权限…";

            try {
                // Keep the stream open!
                globalStream = await navigator.mediaDevices.getUserMedia({ video: true });
                isCameraReady = true;
                window.__cameraReady = true;
                status.innerText = "摄像头已开启";
                
                // Initialize MediaPipe logic now, using the SAVED stream
                if(window.initMediaPipeModule) window.initMediaPipeModule(globalStream);

            } catch (e) {
                console.warn("Camera denied:", e);
                isCameraReady = false;
                status.innerText = "摄像头未开启，使用鼠标模式";
            }

            // Transition to Setup
            setTimeout(() => {
                document.getElementById('system-loader').style.display = 'none';
                document.getElementById('setup-screen').style.display = 'flex';
            }, 800);
        }

        // --- PHASE 3: SETUP & REVEAL ---
        function handleSetupFiles(input, btnId) {
            const btn = document.getElementById(btnId);
            if(input.files && input.files.length > 0) {
                btn.classList.add('selected');
                btn.innerText = `已选择 ${input.files.length} 个文件`;
                if(btnId === 'photo-btn') {
                    const startBtn = document.getElementById('start-btn');
                    const files = Array.from(input.files);
                    if (startBtn) startBtn.disabled = true;
                    userPhotos = new Array(files.length);
                    let loaded = 0;
                    const done = () => {
                        loaded++;
                        if (loaded === files.length) {
                            userPhotos = userPhotos.filter(Boolean);
                            if (startBtn) startBtn.disabled = false;
                        }
                    };
                    files.forEach((file, index) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.src = e.target.result;
                            img.onload = () => {
                                userPhotos[index] = { src: e.target.result, aspect: img.width / img.height };
                                done();
                            };
                            img.onerror = done;
                        };
                        reader.onerror = done;
                        reader.readAsDataURL(file);
                    });
                } else if (btnId === 'music-btn') {
                    userAudio = input.files[0];
                }
            }
        }

        function finishSetupAndReveal() {
            // 1. Update Title
            const greeting = document.getElementById('greeting-input').value.trim() || "新年快乐";
            document.getElementById('main-title').innerText = greeting;

            // 2. Add Photos
            if (userPhotos.length > 0 && window.addPhotosToRunningScene) {
                window.addPhotosToRunningScene(userPhotos);
            }

            // 3. Play Audio
            if(userAudio) {
                const audioUrl = URL.createObjectURL(userAudio);
                const audio = new Audio(audioUrl);
                audio.loop = true;
                audio.volume = 0.5;
                audio.play().catch(e => console.log("Audio play failed:", e));
            }

            // 4. Reveal
            const setupScreen = document.getElementById('setup-screen');
            setupScreen.style.opacity = 0;
            setTimeout(() => {
                setupScreen.style.display = 'none';
                if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
                if(window.activateInteraction) window.activateInteraction();
                const hint = document.getElementById('gesture-hint');
                if (!isCameraReady || window.__handModelFailed) {
                    hint.innerText = '未开启摄像头，可用鼠标或空格操作';
                }
                hint.style.opacity = '1';
                setTimeout(() => { hint.style.opacity = '0'; }, 8000);
            }, 800);
        }

        // 键盘快捷键在 3D 模块里统一处理
    </script>

        class WillowParticle { constructor(x, y, angle, speed, colorType, depthScale) { this.x = x; this.y = y; this.vx = Math.cos(angle) * speed * SPEED_MOD; this.vy = Math.sin(angle) * speed * SPEED_MOD; this.friction = 0.94; this.gravity = 0.07 * fwScale * SPEED_MOD; this.life = random(180, 250) / SPEED_MOD; this.maxLife = this.life; this.trail = []; this.maxTrail = 20; this.colorType = colorType; this.depthScale = depthScale; this.width = (colorType === 'gold' ? 1.5 : 1.0) * fwScale * depthScale; } update() { this.trail.push({x: this.x, y: this.y}); if(this.trail.length > this.maxTrail) this.trail.shift(); this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.life--; if(this.life % 8 === 0) smokes.push(new Smoke(this.x, this.y)); return this.life > 0; } draw() { if(this.trail.length < 2) return; const progress = this.life / this.maxLife; const alpha = Math.min(1, progress * 3); fwCtx.beginPath(); fwCtx.moveTo(this.trail[0].x, this.trail[0].y); for(let i=1; i<this.trail.length; i++) fwCtx.lineTo(this.trail[i].x, this.trail[i].y); fwCtx.lineTo(this.x, this.y); fwCtx.lineCap = 'round'; fwCtx.lineWidth = this.width * alpha; let strokeStyle = `rgba(255, 240, 150, ${alpha})`; if(this.colorType === 'red') strokeStyle = `rgba(255, 80, 80, ${alpha})`; else if(this.colorType === 'blue') strokeStyle = `rgba(80, 180, 255, ${alpha})`; fwCtx.strokeStyle = strokeStyle; fwCtx.stroke(); if (progress > 0.05) { const s = this.width * 2.5; fwCtx.drawImage(glowCanvas, this.x - s/2, this.y - s/2, s, s); } } }
        class Shell { constructor(x, y, targetX, targetY, type, depthScale) { this.x = x; this.y = y; this.targetY = targetY; this.type = type; this.depthScale = depthScale; const g = 0.15 * fwScale * SPEED_MOD; const dy = y - targetY; const vy = Math.sqrt(2 * g * dy); const t = vy / g; const dx = targetX - x; const vx = dx / t; this.vx = vx; this.vy = -vy; this.gravity = g; this.isDead = false; } update() { this.vy += this.gravity; this.x += this.vx; this.y += this.vy; if (Math.random() > 0.7) smokes.push(new Smoke(this.x, this.y)); if (this.vy >= 0) { this.isDead = true; if(this.type === 'willow') explodeWillow(this.x, this.y, this.depthScale); else if(this.type === 'comet') explodeComet(this.x, this.y); for(let i=0; i<6; i++) smokes.push(new Smoke(this.x + random(-10,10), this.y + random(-10,10))); } return !this.isDead; } draw() { const size = 6 * fwScale * this.depthScale; fwCtx.drawImage(glowCanvas, this.x - size, this.y - size, size*2, size*2); fwCtx.beginPath(); fwCtx.moveTo(this.x, this.y); fwCtx.lineTo(this.x - this.vx*2.5, this.y - this.vy*2.5); fwCtx.lineCap = 'round'; fwCtx.strokeStyle = 'rgba(255, 200, 100, 0.3)'; fwCtx.lineWidth = 4 * fwScale; fwCtx.stroke(); fwCtx.beginPath(); fwCtx.moveTo(this.x, this.y); fwCtx.lineTo(this.x - this.vx*2.5, this.y - this.vy*2.5); fwCtx.strokeStyle = 'rgba(255, 255, 220, 0.95)'; fwCtx.lineWidth = 1.5 * fwScale; fwCtx.stroke(); } }

        async function loadSvgTexture(url, width, height, fallbackText = '福') {
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`${res.status} ${url}`);
                const svgText = await res.text();
                const blobUrl = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
                const img = new Image();
                img.src = blobUrl;
                await img.decode();
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                URL.revokeObjectURL(blobUrl);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            } catch (e) {
                console.warn('SVG load failed, using fallback:', url, e);
                const canvas = document.createElement('canvas');
                canvas.width = width; canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#b30000'; ctx.fillRect(0, 0, width, height);
                ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = Math.max(6, width * 0.02);
                ctx.strokeRect(ctx.lineWidth, ctx.lineWidth, width - ctx.lineWidth * 2, height - ctx.lineWidth * 2);
                ctx.fillStyle = '#ffd36b';
                ctx.font = `bold ${Math.floor(height * 0.5)}px "STKaiti", "KaiTi", serif`;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(fallbackText || '福', width / 2, height / 2);
                const tex = new THREE.CanvasTexture(canvas);
                tex.colorSpace = THREE.SRGBColorSpace;
                return tex;
            }
        }

        async function addFuParticles() {
            const fuTex = await loadSvgTexture('./assets/fu.svg', 512, 512, '福');
            const fuGeo = new THREE.PlaneGeometry(4.8, 4.8, 32, 32);
            const fuPos = fuGeo.attributes.position;
            const capRadius = 9.7;
            for (let i = 0; i < fuPos.count; i++) {
                const x = fuPos.getX(i);
                const y = fuPos.getY(i);
                const z = Math.sqrt(Math.max(0, capRadius * capRadius - x * x - y * y)) - capRadius;
                fuPos.setZ(i, z);
            }
            fuGeo.computeVertexNormals();
            for (const z of [9.65, -9.65]) {
                const mat = new THREE.MeshBasicMaterial({ map: fuTex, transparent: true, depthWrite: false, side: THREE.DoubleSide });
                const plane = new THREE.Mesh(fuGeo, mat);
                plane.renderOrder = 20;
                if (z < 0) plane.rotation.y = Math.PI;
                mainGroup.add(plane);
                particleSystem.push(new Particle(plane, 'FU', new THREE.Vector3(0, 0, z)));
            }
            fuReady = true;
        }

        class Particle {
            constructor(mesh, type, posTree) {
                this.mesh = mesh;
                this.type = type;
                this.baseScale = mesh.scale.x;
                this.posTree = posTree.clone();
                this.posScatter = new THREE.Vector3();

                let rScatter = 10 + Math.random() * 15;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                this.posScatter.set(rScatter * Math.sin(phi) * Math.cos(theta), rScatter * Math.sin(phi) * Math.sin(theta), rScatter * Math.cos(phi));
                const spinMult = 8.0; 
                this.spinSpeed = new THREE.Vector3((Math.random()-0.5) * spinMult, (Math.random()-0.5) * spinMult, (Math.random()-0.5) * spinMult);
            }

            update(dt, mode, focusTargetMesh) {
                if (this.type === 'PHOTO') {
                    this.mesh.visible = mode !== 'TREE';
                    const focused = this.mesh === focusTargetMesh;
                    if (this.mesh.userData.thumb) this.mesh.userData.thumb.visible = !(mode === 'FOCUS' && focused);
                    if (this.mesh.userData.focus) this.mesh.userData.focus.visible = mode === 'FOCUS' && focused;
                }
                let target = this.posTree;
                let s = this.baseScale;
                
                if (mode === 'SCATTER') {
                    target = this.posScatter;
                    this.mesh.rotation.x += this.spinSpeed.x * dt;
                    this.mesh.rotation.y += this.spinSpeed.y * dt;
                    this.mesh.rotation.z += this.spinSpeed.z * dt;
                    if (this.type === 'PHOTO' || this.type === 'CARD') {
                        s = this.baseScale * 2.5;
                        this.mesh.rotation.x *= 0.9; this.mesh.rotation.y *= 0.9; this.mesh.rotation.z *= 0.9;
                    }
                } else if (mode === 'FOCUS') {
                    if (this.mesh === focusTargetMesh) {
                        const desiredWorldPos = new THREE.Vector3(0, 2, 35);
                        if (this.worldCard) {
                            target = desiredWorldPos;
                        } else {
                            const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                            target = desiredWorldPos.applyMatrix4(invMatrix);
                        }
                        this.mesh.lookAt(camera.position);
                        s = this.worldCard ? 3.6 : 4.5;
                    } else {
                        target = this.posScatter; 
                        s = (this.type === 'PHOTO' || this.type === 'CARD') ? this.baseScale * 2.0 : this.baseScale * 0.8;
                    }
                } else {
                    if (this.type === 'FU') {
                        this.mesh.rotation.set(0, this.posTree.z > 0 ? 0 : Math.PI, 0);
                    } else {
                        this.mesh.rotation.x *= 0.95;
                        this.mesh.rotation.z *= 0.95;
                        if (this.worldCard) this.mesh.lookAt(camera.position);
                    }
                }
                
                const lerpSpeed = 2.5;
                this.mesh.position.lerp(target, lerpSpeed * dt);
                this.mesh.scale.lerp(new THREE.Vector3(s,s,s), 4.0 * dt);
            }
        }

        function createSnow() {
            const geo = new THREE.BufferGeometry();
            const pos = []; const vel = [];
            for(let i=0; i<CONFIG.dust.count; i++) {
                pos.push((Math.random()-0.5)*80, (Math.random()-0.5)*80+10, (Math.random()-0.5)*80);
                vel.push((Math.random()-0.5)*0.5, -(Math.random()*0.5+0.5)*CONFIG.dust.speed, (Math.random()-0.5)*0.5);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geo.userData = { vel: vel };
            const cvs = document.createElement('canvas'); cvs.width=32; cvs.height=32;
            const ctx = cvs.getContext('2d');
            const gr = ctx.createRadialGradient(16,16,0,16,16,16);
            gr.addColorStop(0,'rgba(255,211,107,1)'); gr.addColorStop(1,'rgba(255,211,107,0)');
            ctx.fillStyle=gr; ctx.fillRect(0,0,32,32);
            const mat = new THREE.PointsMaterial({ size: 0.5, map: new THREE.CanvasTexture(cvs), transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
            snowSystem = new THREE.Points(geo, mat);
            scene.add(snowSystem);
        }

        function changeState(newState) {
            if (STATE.mode === newState) return;
            
            // FIXED: Fireworks only on COLLAPSE (Scatter -> Tree), AND has expanded once
            if (newState === 'SCATTER') {
                STATE.hasExpandedOnce = true;
            }
            if (newState === 'TREE' && STATE.mode === 'SCATTER' && STATE.hasExpandedOnce) {
                 triggerChapter3Fireworks();
            }
            
            STATE.mode = newState;
            STATE.focusTarget = null;
            if (newState === 'TREE') goldEnterStart = performance.now();
        }

        function setupInteraction() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
                resizeFireworks();
            });

            const onClick = (event) => {
                if (!STATE.interactionEnabled) return;

                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(mainGroup.children, true);
                if (STATE.mode === 'TREE') {
                    changeState('SCATTER');
                } else if (STATE.mode === 'SCATTER') {
                    let hitCard = false;
                    for (let hit of intersects) {
                        let obj = hit.object;
                        let p = null;
                        while (obj) {
                            p = particleSystem.find(pt => pt.mesh === obj);
                            if (p) break;
                            obj = obj.parent;
                        }
                        if (p && (p.type === 'PHOTO' || p.type === 'CARD')) {
                            STATE.mode = 'FOCUS';
                            STATE.focusTarget = p.mesh;
                            if (p.type === 'PHOTO') {
                                const photos = particleSystem.filter(q => q.type === 'PHOTO');
                                photoFocusIndex = photos.indexOf(p);
                            }
                            hitCard = true;
                            break;
                        }
                    }
                    if (!hitCard) changeState('TREE');
                } else if (STATE.mode === 'FOCUS') {
                    changeState('SCATTER');
                }
            };
            window.addEventListener('mousedown', onClick);
            window.addEventListener('touchstart', (e) => {
                const t = e.touches[0];
                if (t) onClick({ clientX: t.clientX, clientY: t.clientY });
            }, {passive: false});
        }

        let lastVideoTime = -1;
        let predictCount = 0;
        async function predictWebcam() {
            predictCount++;
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    if (result.landmarks.length > 0 && STATE.interactionEnabled) {
                        STATE.hand.detected = true;
                        const lm = result.landmarks[0];
                        const wrist = lm[0];
                        const tips = [lm[8], lm[12], lm[16], lm[20]];
                        let avgDist = 0;
                        tips.forEach(t => avgDist += Math.hypot(t.x - wrist.x, t.y - wrist.y));
                        avgDist /= 4;
                        const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                        const action = resolveGesture({ pinchDist, avgDist, mode: STATE.mode });
                        if (action === 'focus') focusNextPhoto();
                        else if (action === 'exit-focus') changeState('SCATTER');
                        else if (action === 'lantern') changeState('TREE');
                        else if (action === 'scatter') changeState('SCATTER');
                        STATE.hand.x = (lm[9].x - 0.5) * 2; STATE.hand.y = (lm[9].y - 0.5) * 2;
                    } else if (result.landmarks.length === 0) {
                        STATE.hand.detected = false;
                    }
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            fwCtx.clearRect(0, 0, fwWidth, fwHeight);
            fwCtx.globalCompositeOperation = 'lighter';
            let sIdx = smokes.length; while(sIdx--) { if(!smokes[sIdx].update()) smokes.splice(sIdx, 1); else smokes[sIdx].draw(); }
            let pIdx = particles.length; while(pIdx--) { if(!particles[pIdx].update()) particles.splice(pIdx, 1); else particles[pIdx].draw(); }
            if (snowSystem) {
                const pos = snowSystem.geometry.attributes.position.array;
                const vel = snowSystem.geometry.userData.vel;
                for(let i=0; i<CONFIG.dust.count; i++) {
                    pos[i*3+1] += vel[i*3+1] * dt * 5.0; 
                    pos[i*3] += Math.sin(clock.elapsedTime+i)*0.02;
                    if(pos[i*3+1] < -20) pos[i*3+1] = 40;
                }
                snowSystem.geometry.attributes.position.needsUpdate = true;
            }
            if (STATE.mode === 'SCATTER' && STATE.hand.detected) {
                const tx = STATE.hand.y * Math.PI * 0.25; const ty = STATE.hand.x * Math.PI * 0.9;
                STATE.rotation.x += (tx - STATE.rotation.x) * 3 * dt; STATE.rotation.y += (ty - STATE.rotation.y) * 3 * dt;
            } else {
                if (STATE.mode === 'TREE') STATE.rotation.y += 0.3 * dt; else STATE.rotation.y += 0.1 * dt;
                STATE.rotation.x *= 0.95; 
            }
            mainGroup.rotation.x = STATE.rotation.x; mainGroup.rotation.y = STATE.rotation.y;
            const photoParentQInv = mainGroup.quaternion.clone().invert();
            particleSystem.forEach(p => {
                p.update(dt, STATE.mode, STATE.focusTarget);
                if (p.type === 'PHOTO') {
                    p.mesh.quaternion.copy(photoParentQInv.clone().multiply(camera.quaternion));
                }
            });
            for (const p of particleSystem) {
                if (p.type !== 'FU') continue;
                p.mesh.visible = true;
                if (STATE.mode === 'TREE') {
                    const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(p.mesh.getWorldQuaternion(new THREE.Quaternion()));
                    const worldPos = p.mesh.getWorldPosition(new THREE.Vector3());
                    const toCam = camera.position.clone().sub(worldPos).normalize();
                    const facing = Math.max(0, normal.dot(toCam));
                    p.mesh.material.opacity = 0.35 + 0.65 * facing;
                    p.mesh.material.depthTest = false;
                } else {
                    p.mesh.material.opacity = 1;
                    p.mesh.material.depthTest = true;
                }
            }
            let maxDist2 = 0;
            for (const p of particleSystem) {
                if (p.type === 'CARD' || p.type === 'PHOTO') continue;
                maxDist2 = Math.max(maxDist2, p.mesh.position.distanceToSquared(p.posTree));
            }
            const bodySettled = maxDist2 < 0.36;
            if (!bodySettled || STATE.mode !== 'TREE') settleSince = 0;
            else if (!settleSince) settleSince = performance.now();
            const allSettled = bodySettled && settleSince > 0 && (performance.now() - settleSince) > 1400;
            let goldEntered = true;
            if (goldTop && goldBottom) {
                const showGold = STATE.mode === 'TREE';
                goldTop.visible = showGold;
                goldBottom.visible = showGold;
                if (showGold) {
                    const elapsed = performance.now() - goldEnterStart;
                    const t = Math.min(1, elapsed / 900);
                    const ease = 1 - Math.pow(1 - t, 3);
                    goldTop.position.y = 24 * (1 - ease);
                    goldBottom.position.y = -24 * (1 - ease);
                    goldEntered = t >= 1;
                } else {
                    goldTop.position.y = 24;
                    goldBottom.position.y = -24;
                    goldEntered = false;
                }
            }
            lanternReady = STATE.mode === 'TREE' && allSettled && goldEntered && fuReady;
            if (lanternShell) {
                if (STATE.mode !== 'TREE') {
                    lanternShell.material.opacity = 0;
                    lanternShell.visible = false;
                } else {
                    const targetOpacity = lanternReady ? 0.32 : 0;
                    lanternShell.material.opacity += (targetOpacity - lanternShell.material.opacity) * Math.min(1, dt * 5);
                    lanternShell.visible = lanternShell.material.opacity > 0.01;
                }
            }
            if (lanternStatic) lanternStatic.visible = lanternReady;
            if (!uiHidden && uiLayerEl) uiLayerEl.style.opacity = STATE.mode === 'FOCUS' ? '0' : '1';
            composer.render();
        }
    </script>
